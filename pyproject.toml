[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-reader"
version = "0.1.0"
description = "Local CLI for importing and querying WhatsApp TXT exports in SQLite."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
whatsapp-reader = "whatsapp_reader.cli:main"

[tool.setuptools]
packages = ["whatsapp_reader"]
