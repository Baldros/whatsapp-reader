[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-reader"
version = "0.1.0"
description = "Local CLI for importing and querying WhatsApp TXT exports in SQLite."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
agent = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
]
chat = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "prompt_toolkit>=3.0,<4.0",
    "rich>=14.0,<15.0",
]

[project.scripts]
whatsapp-reader = "whatsapp_reader.cli:main"

[tool.setuptools]
packages = ["whatsapp_reader"]
